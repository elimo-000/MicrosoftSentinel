# =============================================================================================
# pfSense -> Microsoft Sentinel: raw Syslog path (dedicated listening port + static marker)
# =============================================================================================
# Every message received on the dedicated pfSense port is forwarded UNCHANGED (original
# facility, severity, hostname and program name) to the local Azure Monitor Agent, with one
# addition: a static marker right after the syslog tag, so it lands in the Syslog table as
#
#     ProcessName = filterlog | sshd | openvpn | php-fpm | ...
#     SyslogMessage = "[pfsense] <original message>"
#
# The parsers (vimNetworkSessionPfsenseSyslogCustom, vimAuthenticationPfsenseCustom) select
# pfSense rows with  SyslogMessage startswith "[pfsense]"  + ProcessName, so no hostname
# naming convention or source IP list is needed to tell pfSense apart from other sources.
#
# Suggested location: /etc/rsyslog.d/05-pfsense-raw.conf
#
# PREREQUISITES
# - The AMA forwarder installation script must already have run. It enables the imudp/imtcp
#   modules, so this file does NOT load them again; it only adds a new input.
# - Firewall / load balancer: open and forward <PFSENSE_PORT> (UDP) to the collector(s).
#   RHEL-family with SELinux enforcing:  semanage port -a -t syslogd_port_t -p udp 5514
# - pfSense: Status > System Logs > Settings > Remote Logging Options
#     * Log Message Format = syslog (RFC 5424)  -> carries the real device hostname
#     * Remote log servers = <collector-or-LB>:<PFSENSE_PORT>
#     * Remote Syslog Contents = Firewall Events, General Authentication Events, VPN Events
# - Data Collection Rule (Syslog stream, Microsoft-Syslog): must collect the facilities pfSense
#   uses (local0 = filterlog, auth/authpriv = sshd/sshguard/webGUI, daemon = openvpn/charon,
#   user = misc), at least at the "info" level.
#
# VALIDATE before restarting:   rsyslogd -N1   then   systemctl restart rsyslog
# =============================================================================================

# Same wire format AMA's own forwarder uses (RFC 3164 "traditional", octet-counted TCP framing,
# no trailing newline), so AMA fills HostName / ProcessName / SyslogMessage exactly as it does
# for its default forwarding. The only change is the static marker after %syslogtag%.
# VERIFY against the template in your collector's /etc/rsyslog.d/10-azuremonitoragent-omfwd.conf
# (written by the AMA forwarder script) and mirror it if it differs -- keep only the marker.
template(name="PfsenseRawToAma" type="string"
    string="<%PRI%>%TIMESTAMP% %HOSTNAME% %syslogtag% [pfsense]%msg:::sp-if-no-1st-sp%%msg%")

ruleset(name="pfsense_raw") {
    action(type="omfwd"
        target="127.0.0.1" port="28330" protocol="tcp" tcp_framing="octet-counted"
        template="PfsenseRawToAma"
        queue.type="LinkedList" queue.filename="omfwd-pfsense-raw" queue.maxFileSize="32m"
        queue.size="500000" queue.highWaterMark="300000" queue.discardMark="400000"
        queue.discardSeverity="8" queue.saveOnShutdown="on"
        action.resumeRetryCount="-1")
    stop
}

# Dedicated pfSense listening port (pfSense's built-in syslogd sends UDP only).
input(type="imudp" port="5514" ruleset="pfsense_raw")

# Optional: TCP listener, only if devices send via the syslog-ng package over TCP.
# input(type="imtcp" port="5514" ruleset="pfsense_raw")

